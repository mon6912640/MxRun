[package]
name = "mxrun"
version = "0.1.0"
edition = "2024"
description = "MxRun - a modern, fast and reliable keyboard launcher (AltRun reimagined)"

[dependencies]
eframe = { version = "0.36", features = ["glow"] }
nucleo-matcher = "0.3"
global-hotkey = "0.8"
redb = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
evalexpr = "13"
open = "5"
pinyin = "0.11"
tray-icon = "0.25"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Globalization",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
